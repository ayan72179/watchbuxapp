                  <TextView android:id="@+id/btn_grant_battery" android:text="Grant" android:background="@drawable/bg_grant_purple" android:textColor="#FFFFFF" android:paddingHorizontal="18dp" android:paddingVertical="7dp" android:textStyle="bold" android:textSize="12sp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
