name: Build Watchbux Official APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python for Icon Processing
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install pillow

      - name: Install Android Platform 34 & Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Create Architecture Structure
        run: |
          mkdir -p app/src/main/java/com/fomo/earn
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Finds and strictly uses your uploaded logo.png without generating fake or black replacement icons
      - name: Process Exact User Logo
        run: |
          python3 - << 'EOF'
          import os, sys
          from PIL import Image

          user_logo = None
          search_candidates = ["logo.png", "logo.PNG", "app/logo.png", "app/src/main/res/drawable/logo.png"]
          for c in search_candidates:
              if os.path.isfile(c):
                  user_logo = c
                  break

          if not user_logo:
              found_images = []
              for root, dirs, files in os.walk("."):
                  if ".git" in root or "app/build" in root or "app/src/main/res" in root or "gradle" in root:
                      continue
                  for f in files:
                      if f.lower().endswith((".png", ".jpg", ".jpeg", ".webp")):
                          found_images.append(os.path.join(root, f))
              if found_images:
                  found_images.sort(key=lambda x: 0 if any(k in x.lower() for k in ["logo", "watchbux", "icon"]) else 1)
                  user_logo = found_images[0]

          if not user_logo:
              print("FATAL ERROR: logo.png not found! Please upload your logo.png in repository root.")
              sys.exit(1)

          print(f"--> [SUCCESS] Using exact uploaded Watchbux logo: {user_logo}")
          base_img = Image.open(user_logo).convert("RGBA")

          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }
          for folder, size in densities.items():
              resized = base_img.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(f"app/src/main/res/{folder}/ic_launcher.png", format="PNG")
              resized.save(f"app/src/main/res/{folder}/ic_launcher_round.png", format="PNG")

          splash = base_img.resize((256, 256), Image.Resampling.LANCZOS)
          splash.save("app/src/main/res/drawable/ic_logo.png", format="PNG")

          fg = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          safe_logo = base_img.resize((288, 288), Image.Resampling.LANCZOS)
          fg.paste(safe_logo, (72, 72), safe_logo)
          fg.save("app/src/main/res/drawable/ic_launcher_foreground.png", format="PNG")
          EOF

      - name: Generate Gradle Setup
        run: |
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Watchbux"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }

          android {
              namespace 'com.fomo.earn'
              compileSdk 34

              defaultConfig {
                  applicationId "com.fomo.earn"
                  minSdk 24
                  targetSdk 34
                  versionCode 25
                  versionName "3.0.0"
              }

              buildTypes {
                  release { minifyEnabled false }
                  debug { minifyEnabled false }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

      - name: Create Clean XML Resources & Adaptive Drawables
        run: |
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0A0F1E</color>
              <color name="accent_blue">#0284C7</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_pill_blue.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#F20284C7" />
              <corners android:radius="24dp" />
              <stroke android:color="#38BDF8" android:width="1.5dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_grant_purple.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#0284C7" />
              <corners android:radius="20dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_granted_green.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#DCFCE7" />
              <stroke android:color="#86EFAC" android:width="1dp" />
              <corners android:radius="20dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_start_disabled.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#E5E7EB" />
              <corners android:radius="28dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_start_enabled.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#16A34A" />
              <corners android:radius="28dp" />
